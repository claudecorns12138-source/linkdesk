[package]
name = "linkdesk"
version = "0.1.0-alpha.2"
edition = "2021"
license = "MIT"
description = "Native LAN screen sharing and experimental extended displays"
repository = "https://github.com/claudecorns12138-source/linkdesk"

[dependencies]
anyhow = "1"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "wgpu", "glow", "x11", "wayland"] }
openh264 = "0.9"
rand = "0.9"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"

[target.'cfg(windows)'.dependencies]
scrap = "0.5"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
